<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>БиМек ДОО — Евиденција</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;min-height:100vh;
  background:linear-gradient(135deg,#0f0c29 0%,#302b63 50%,#24243e 100%);
  display:flex;align-items:center;justify-content:center;padding:24px}
.wrap{width:100%;max-width:560px}
.logo{text-align:center;margin-bottom:36px}
.logo-icon{font-size:52px;display:block;margin-bottom:12px}
.logo h1{color:#fff;font-size:26px;font-weight:800}
.logo p{color:rgba(255,255,255,.55);font-size:13px;margin-top:6px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
  border-radius:16px;padding:32px 22px;color:#fff;transition:all .2s;
  text-align:center;text-decoration:none;display:block}
.card:hover{background:rgba(255,255,255,.18);transform:translateY(-4px);
  box-shadow:0 16px 40px rgba(0,0,0,.4)}
.card-icon{font-size:44px;display:block;margin-bottom:14px}
.card h2{font-size:16px;font-weight:700;margin-bottom:8px}
.card p{font-size:12px;opacity:.6;line-height:1.5}
.footer{text-align:center;margin-top:32px;color:rgba(255,255,255,.3);font-size:12px}
@media(max-width:480px){.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <span class="logo-icon">🏢</span>
    <h1>БиМек ДОО Скопје</h1>
    <p>Интерен портал за евиденција</p>
  </div>
  <div class="cards">
    <a href="patni-nalozi.html" class="card">
      <span class="card-icon">🚗</span>
      <h2>Патни налози</h2>
      <p>Евиденција на службени патувања и трошоци</p>
    </a>
    <a href="godisni-odmori.html" class="card">
      <span class="card-icon">🌴</span>
      <h2>Годишни одмори</h2>
      <p>Планирање и евиденција на одмори</p>
    </a>
  </div>
  <div class="footer">© 2025 БиМек ДОО — Сите права задржани</div>
</div>
</body>
</html>
