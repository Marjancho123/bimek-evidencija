*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;font-size:14px}

/* LOGIN */
.login-bg{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#0f0c29 0%,#302b63 50%,#24243e 100%)}
.login-card{background:#fff;border-radius:20px;padding:44px 40px;width:100%;max-width:400px;

.login-icon{text-align:center;font-size:56px;margin-bottom:8px}

.login-company{text-align:center;font-size:13px;color:#666;margin-top:4px;margin-bottom:28px;font-weight:500}
.login-err{background:#fff0f0;color:#c0392b;border:1px solid #fbb;border-radius:8px;
  padding:10px 14px;font-size:13px;margin-bottom:16px}
.login-hint{background:#f0f7ff;color:#1a5276;border:1px solid #aed6f1;border-radius:8px;
  padding:10px 14px;font-size:12px;margin-top:16px;line-height:1.8}
.lbl{display:block;font-size:11px;font-weight:700;color:#888;text-transform:uppercase;
  letter-spacing:.6px;margin-bottom:5px}
.inp{width:100%;padding:11px 14px;border:2px solid #e8e8e8;border-radius:10px;font-size:14px;
  font-family:inherit;color:#222;background:#fff;transition:border-color .2s}
.inp:focus{outline:none;border-color:#302b63;box-shadow:0 0 0 3px rgba(48,43,99,.1)}
.inp:disabled{background:#f8f8f8;color:#888;cursor:not-allowed}
.inp-wrap{margin-bottom:14px}
.btn-login{width:100%;padding:13px;background:linear-gradient(135deg,#302b63,#0f0c29);
  color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px}
.btn-login:hover{opacity:.9}

/* TOPBAR */
.topbar{background:linear-gradient(135deg,#1a1a2e,#302b63);color:#fff;

.tb-title{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.tb-sub{font-size:11px;opacity:.5;margin-top:3px}
.tb-right{text-align:right}

.tb-user{font-size:12px;opacity:.75;margin-top:2px}

.tb-btn.ghost{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3)}

.tab{padding:13px 18px;font-size:13px;cursor:pointer;border:none;background:none;color:#888;

.tab:hover{color:#302b63}
.tab.active{color:#302b63;font-weight:700;border-bottom-color:#302b63}

.gs-ok{background:#d5f5e3;color:#1e8449}
.gs-none{background:#fef9e7;color:#856404}
.gs-err{background:#fdecea;color:#c0392b}

/* SPIN */
@keyframes spin{to{transform:rotate(360deg)}}
.spin{display:inline-block;width:18px;height:18px;border:2px solid #a9dfbf;border-top-color:#1e8449;border-radius:50%;animation:spin .7s linear infinite}

@media print{.topbar,.tabs,.form-actions,.toolbar,.btn,.btn-add,.rm-btn,.modal-bg{display:none!important}}
</style>

// ═══════════════════════════════════════════════════════
// HASH (само за промена на лозинка)
// ═══════════════════════════════════════════════════════
async function hashPwd(p){
  const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("bimek24_"+p+"_mk"));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

  setU(u){localStorage.setItem("bimek_u5",JSON.stringify(u));},
  getO(){try{return JSON.parse(localStorage.getItem("bimek_o5")||"null");}catch{return null;}},

};

// ═══════════════════════════════════════════════════════
// GOOGLE SHEETS
// ═══════════════════════════════════════════════════════
function o2rows(orders){
  const h=["ID","Бр","Год","Вработен","Позиција","Датум","Час","Цел","Тргнување","Пристигнување","Враќање","Попатни","Превоз","Таблица","Статус","Создаден","Дат.враќ","Час.враќ","КМ","Трошоци","Вкупно МКД","Резултат","Извештај"];
  return [h,...orders.map(o=>{
    const d=o.dests||{};
    return[o.id,o.num,o.year,o.employee||"",o.position||"",o.dateFrom||"",o.timeFrom||"",o.purpose||"",
      d.departure||"",d.arrival||"",d.returnCity||"",(d.stops||[]).map(s=>s.city).filter(Boolean).join(", "),
      d.transport||"",d.plate||"",o.status,o.created||"",
      o.report?.dateReturn||"",o.report?.timeReturn||"",o.report?.autoKm||"",
      (o.report?.realExpenses||[]).map(e=>e.type+":"+e.amount).join("|"),
      o.report?.realTotal||0,o.report?.outcome||"",o.report?.reportText||""];
  })];
}
async function gsSave(orders){
  if(!GS_URL)return{ok:false};
  try{
    const r=await fetch(GS_URL,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({action:"save",rows:o2rows(orders)})});
    return await r.json();
  }catch(e){return{ok:false,msg:e.message};}
}
async function gsTest(url){
  try{const r=await fetch(url+"?action=ping",{signal:AbortSignal.timeout(7000)});const j=await r.json();return j.ok===true;}catch{return false;}
}

function fmtD(iso){if(!iso)return"—";const[y,m,d]=iso.split("-");return d?d+"."+m+"."+y:iso;}
function fmt(n){return Math.round(n).toLocaleString("mk-MK");}
function today(){const n=new Date();return String(n.getDate()).padStart(2,"0")+"/"+String(n.getMonth()+1).padStart(2,"0")+"/"+String(n.getFullYear()).slice(-2);}

function calcH(df,tf,dr,tr){
  if(!df||!tf||!dr||!tr)return null;
  const a=new Date(df+"T"+tf),b=new Date(dr+"T"+tr);
  if(isNaN(a)||isNaN(b)||b<=a)return null;
  const base=Math.round((b-a)/60000);
  const total=base+60;
  function fm(m){const h=Math.floor(m/60),min=m%60;return(h?h+"ч ":"")+min+"мин";}
  return fm(base)+" + 1ч = "+fm(total);
}

function nextNum(orders,yr){
  const y=orders.filter(o=>o.year===yr);
  return y.length?Math.max(...y.map(o=>o.num||0))+1:1;
}
function renumber(all){
  const g={};
  all.forEach(o=>{const y=o.year||new Date().getFullYear();(g[y]=g[y]||[]).push({...o,year:y});});
  const r=[];
  Object.keys(g).sort().forEach(y=>[...g[y]].sort((a,b)=>Number(a.id)-Number(b.id)).forEach((o,i)=>r.push({...o,num:i+1})));
  return r.sort((a,b)=>b.year-a.year||b.num-a.num);
}
function saveOrders(orders){
  LS.setO({orders});
  if(GS_URL)gsSave(orders).then(r=>{S.gsOk=r.ok;render();}).catch(()=>{S.gsOk=false;render();});
}

// ═══════════════════════════════════════════════════════
let _km=null;
function triggerKm(){
  clearTimeout(_km);
  _km=setTimeout(calcKm,900);

async function calcKm(){
  const d=S.form?.dests;
  if(!d?.departure||!d?.arrival){S.kmAuto=null;render();return;}
  S.kmLoading=true;render();
  const cities=[d.departure,...(d.stops||[]).map(s=>s.city).filter(Boolean),d.arrival,d.returnCity].filter(Boolean);
  try{
    const coords=[];
    for(const city of cities){
      let found=null;
      for(const q of[city+", North Macedonia",city+", Macedonia",city]){
        try{
          const r=await fetch("https://nominatim.openstreetmap.org/search?q="+encodeURIComponent(q)+"&format=json&limit=1&countrycodes=mk",
            {headers:{"User-Agent":"BiMek/5","Accept-Language":"mk,en"},signal:AbortSignal.timeout(5000)});
          const j=await r.json();
          if(j&&j.length){found={lon:+j[0].lon,lat:+j[0].lat};break;}
        }catch{}
      }
      if(!found){S.kmLoading=false;S.kmAuto=null;render();return;}
      coords.push(found);
    }
    const cs=coords.map(c=>c.lon+","+c.lat).join(";");
    const r2=await fetch("https://router.project-osrm.org/route/v1/driving/"+cs+"?overview=false",{signal:AbortSignal.timeout(8000)});
    const j2=await r2.json();
    S.kmAuto=(j2.code==="Ok"&&j2.routes?.length)?Math.round(j2.routes[0].distance/1000):null;
    if(S.rep&&S.kmAuto)S.rep.autoKm=S.kmAuto;
  }catch{S.kmAuto=null;}
  S.kmLoading=false;render();
}

function render(){
  const root=document.getElementById("root");
  if(!root)return;

  if(!S.user){
    root.innerHTML=rLogin();
    setTimeout(()=>{const e=document.getElementById("lu");if(e)e.focus();},20);
    return;
  }

  const{orders,view,search,fSt,saving,msg:m,msgErr,user}=S;
  const aId=document.activeElement?.id;
  const aSS=document.activeElement?.selectionStart??null;
  const aSE=document.activeElement?.selectionEnd??null;

  const mine=canAll()?orders:orders.filter(o=>o.employee===user.name||o.createdBy===user.id);
  const fil=mine.filter(o=>{
    const q=search.toLowerCase(),d=o.dests||{};
    const loc=[d.departure,d.arrival,d.returnCity,...(d.stops||[]).map(s=>s.city)].filter(Boolean).join(" ").toLowerCase();
    return(!q||(o.employee||"").toLowerCase().includes(q)||(o.purpose||"").toLowerCase().includes(q)||loc.includes(q))&&(!fSt||o.status===fSt);
  });
  const st={tot:mine.length,apr:mine.filter(o=>o.status==="Одобрен").length,don:mine.filter(o=>o.status==="Завршен").length,sum:mine.reduce((s,o)=>s+(o.report?.realTotal||0),0)};

  const rows=!fil.length?"<tr class='erow'><td colspan='8'>Нема евидентирани налози — кликнете + Нов налог за да почнете</td></tr>":
    fil.map(o=>{
      const s=SS[o.status]||{bg:"#eee",c:"#555"},yr=o.year||new Date().getFullYear(),d=o.dests||{};
      const route=[d.departure,d.arrival,d.returnCity].filter(Boolean).join("→")||"—";
      return "<tr>"+
        "<td style='font-weight:700;color:#302b63;white-space:nowrap'>"+o.num+"/"+yr+"</td>"+
        "<td style='white-space:nowrap;color:#666'>"+fmtD(o.dateFrom)+"</td>"+
        "<td style='font-weight:600;white-space:nowrap'>"+esc(o.employee)+"</td>"+
        "<td style='color:#555;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap' title='"+route+"'>"+route+"</td>"+
        "<td style='color:#555;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap'>"+esc(o.purpose||"—")+"</td>"+
        (o.report?"<td><span style='font-weight:700;color:#1e8449'>"+fmt(o.report.realTotal||0)+" МКД</span></td>":"<td><span style='color:#ccc'>—</span></td>")+
        "<td><span class='badge' style='background:"+s.bg+";color:"+s.c+"'>"+o.status+"</span></td>"+
        "<td style='white-space:nowrap'>"+
        "<button class='btn sm' onclick=\"openEdit('"+o.id+"')\">Уреди</button>"+
        (o.status==="Одобрен"&&!o.report?"<button class='btn sm success' onclick=\"openEdit('"+o.id+"')\">По враќање</button>":"")+
        "<button class='btn sm' onclick=\"doPrint('"+o.id+"')\">Печати</button>"+
        (isAdmin()?"<button class='btn sm danger' onclick=\"delOrder('"+o.id+"')\">✕</button>":"")+
        "</td></tr>";
    }).join("");

  const isForm=view==="new"||view==="edit";
  const gsInd=GS_URL?(S.gsOk===true?"<span class='sok'>● GSheets</span>":"<span class='serr'>● GSheets</span>"):"<span style='color:#ccc;font-size:11px'>○ GSheets</span>";

  root.innerHTML=
    "<div class='topbar'>"+
    "<div class='tb-left'><div class='tb-title'>🚗 Патни налози</div><div class='tb-sub'>Евиденција на службени патувања</div></div>"+
    "<div class='tb-right'>"+
    "<div class='tb-company'>"+COMPANY+"</div>"+
    "<div class='tb-user'>👤 "+esc(user.name)+(user.role==="admin"?" <span style='font-size:10px;background:#ffd700;color:#856404;padding:1px 5px;border-radius:3px;font-weight:700;margin-left:4px'>ADMIN</span>":user.role==="manager"?" <span style='font-size:10px;background:#cce5ff;color:#004085;padding:1px 5px;border-radius:3px;font-weight:700;margin-left:4px'>МЕНАЏЕР</span>":"")+"</div>"+
    "<div class='tb-btns'>"+
    "<button class='tb-btn white' onclick='openNew()'>+ Нов налог</button>"+
    "<button class='tb-btn excel' onclick='doExcel("+( canAll()?"S.orders":"S.orders.filter(o=>o.employee===S.user.name||o.createdBy===S.user.id)")+ ")'>📥 Excel</button>"+
    "<button class='tb-btn ghost' onclick='openMyProfile()'>👤 Профил</button>"+
    "<button class='tb-btn ghost' onclick=\"S.user=null;sessionStorage.removeItem('bs');render()\">Одјава</button>"+
    "</div></div></div>"+

    "<div class='tabs'>"+
    "<button class='tab"+(view==="list"?" active":"")+"' onclick=\"set({view:'list',editId:null})\">📋 Евиденција</button>"+
    "<button class='tab"+(isForm?" active":"")+"' onclick='openNew()'>"+(view==="edit"?"✏️ Уреди":"➕ Нов налог")+"</button>"+
    (isAdmin()?"<button class='tab atab"+(view==="admin"?" active":"")+"' onclick=\"set({view:'admin',aTab:'users',editId:null})\">⚙️ Администрација</button>":"")+
    "<div class='tab-right'>"+gsInd+(m?"<span class='"+(msgErr?"serr":"sok")+"'>"+m+"</span>":"")+(saving?"<span class='sing'>Зачувување...</span>":"")+"</div>"+
    "</div>"+

    "<div class='main'>"+
    (view==="list"?
      "<div class='stats'>"+
      "<div class='stat'><div class='stat-lbl'>Вкупно налози</div><div class='stat-val'>"+st.tot+"</div></div>"+
      "<div class='stat'><div class='stat-lbl'>Одобрени</div><div class='stat-val'>"+st.apr+"</div></div>"+
      "<div class='stat'><div class='stat-lbl'>Завршени</div><div class='stat-val'>"+st.don+"</div></div>"+
      "<div class='stat'><div class='stat-lbl'>Реални трошоци</div><div class='stat-val'>"+fmt(st.sum)+"</div><div class='stat-sub'>МКД</div></div>"+
      "</div>"+
      "<div class='toolbar'>"+
      "<input placeholder='🔍 Пребарај по вработен, маршрута, цел...' value='"+esc(search)+"' oninput=\"S.search=this.value;render()\">"+
      "<select onchange=\"S.fSt=this.value;render()\"><option value=''>Сите статуси</option>"+STATUSES.map(s=>"<option"+(s===fSt?" selected":"")+">"+s+"</option>").join("")+"</select>"+
      "</div>"+
      "<div class='tbl-wrap'><table>"+
      "<thead><tr><th>Бр.</th><th>Датум</th><th>Вработен</th><th>Маршрута</th><th>Цел</th><th>Реални трошоци</th><th>Статус</th><th>Акции</th></tr></thead>"+
      "<tbody>"+rows+"</tbody></table></div>"
    :view==="admin"?rAdmin():rForm())+
    "</div>"+
    rModal();

  if(aId){const e=document.getElementById(aId);if(e){e.focus();if(aSS!==null&&e.setSelectionRange)try{e.setSelectionRange(aSS,aSE);}catch{}}}
}

// ═══════════════════════════════════════════════════════
// ACTIONS
// ═══════════════════════════════════════════════════════
async function doLogin(){
  const u=S.lu.trim().toLowerCase(),p=S.lp;
  if(!u||!p){S.le="Внесете корисничко име и лозинка.";render();return;}
  const found=S.users.find(x=>x.username.toLowerCase()===u&&x.active);
  if(!found){S.le="Корисничкото име не постои или е деактивирано.";render();return;}
  const h=await hashPwd(p);
  if(h!==found.ph){S.le="Погрешна лозинка.";render();return;}
  sessionStorage.setItem("bs",JSON.stringify({id:found.id}));
  const loc=LS.getO();
  S.orders=loc?.orders||[];
  S.user={...found};S.le="";S.lu="";S.lp="";
  render();
  if(GS_URL)gsSave(S.orders).then(r=>{S.gsOk=r.ok;render();}).catch(()=>{});
}
function openNew(){S.form=emptyOrder();S.rep=emptyRep();S.kmAuto=null;set({view:"new",editId:null});}
function openEdit(id){
  const o=S.orders.find(x=>x.id===id);if(!o)return;
  S.form={employee:o.employee||"",position:o.position||"",dateFrom:o.dateFrom||"",timeFrom:o.timeFrom||"",purpose:o.purpose||"",note:o.note||"",status:o.status||"Нацрт",
    dests:{...(o.dests||{}),stops:(o.dests?.stops||[]).map(s=>({...s}))},expenses:[...(o.expenses||[])]};
  S.rep=o.report?{dateReturn:o.report.dateReturn||"",timeReturn:o.report.timeReturn||"",autoKm:o.report.autoKm||null,outcome:o.report.outcome||"",reportText:o.report.reportText||"",realExpenses:(o.report.realExpenses||[]).map(e=>({...e}))}:emptyRep();
  S.kmAuto=o.report?.autoKm||o.dests?.autoKm||null;
  set({view:"edit",editId:id});
}
function setF(k,v){S.form[k]=v;const skip=["position","purpose","note"];if(!skip.includes(k))render();}
function setR(k,v){S.rep[k]=v;const skip=["outcome","reportText"];if(!skip.includes(k))render();}
function updDest(k,v){S.form.dests[k]=v;render();if(["departure","arrival","returnCity"].includes(k))triggerKm();}
function updPlate(v){S.form.dests.plate=v.toUpperCase();const e=document.getElementById("plateinp");if(e&&document.activeElement!==e)e.value=v.toUpperCase();}
function addStop(){S.form.dests.stops.push({city:""});render();}
function remStop(i){S.form.dests.stops.splice(i,1);render();}
function updStop(i,v){S.form.dests.stops[i].city=v;render();triggerKm();}
function updReal(i,k,v){S.rep.realExpenses[i][k]=v;if(k!=="desc")render();}
function addReal(){S.rep.realExpenses.push({desc:"",type:"Патарини",amount:""});render();}
function remReal(i){S.rep.realExpenses.splice(i,1);render();}

// ═══════════════════════════════════════════════════════
// INIT — синхроно, работи веднаш
// ═══════════════════════════════════════════════════════
(function init(){
  // 1. Вчитај корисници
  S.users=LS.getU()||DEFAULT_USERS;
  if(!LS.getU())LS.setU(DEFAULT_USERS);

  // 2. Провери сесија
  try{
    const sess=JSON.parse(sessionStorage.getItem("bs")||"null");
    if(sess){
      const u=S.users.find(x=>x.id===sess.id&&x.active);
      if(u){S.user={...u};const loc=LS.getO();S.orders=loc?.orders||[];}
    }
  }catch{}

  // 3. Прикажи
  render();

  // 4. GS sync во позадина
  if(S.user&&GS_URL){
    gsSave(S.orders).then(r=>{S.gsOk=r.ok;render();}).catch(()=>{S.gsOk=false;render();});
  }
})();
</script>
